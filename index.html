<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Pixel Sketch Pad</title>
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icon.png">
    <style>
        /* AUTOMATIC BASELINE CONFIGURATIONS: Default Light Mode */
        :root {
            --bg-body: #F0F7FF; 
            --bg-player: #FFFFFF; 
            --border-player: #E1EFFE; 
            --text-main: #1E3A8A; 
            --text-muted: #6B7280;
            --btn-bg: #1D4ED8; 
            --btn-text: #FFFFFF;
            --grid-line: #E5E7EB;
        }

        /* AUTOMATIC BASELINE CONFIGURATIONS: Default Dark Mode */
        @media (prefers-color-scheme: dark) {
            :root {
                --bg-body: #050505;
                --bg-player: #0b0b0d;
                --border-player: #16161a;
                --text-main: #FFFFFF;
                --text-muted: #A3A3A3;
                --btn-bg: #FFFFFF;
                --btn-text: #050505;
                --grid-line: #1a1a1f;
            }
        }

        /* PALETTE SCHEMES: Light-to-Dark background matching maps */
        body.theme-red { --bg-body: #FEF2F2; --border-player: #FEE2E2; --text-main: #991B1B; --btn-bg: #EF4444; }
        body.theme-orange { --bg-body: #FFF7ED; --border-player: #FFEDD5; --text-main: #9A3412; --btn-bg: #F97316; }
        body.theme-yellow { --bg-body: #FEFCE8; --border-player: #FEF9C3; --text-main: #854D0E; --btn-bg: #EAB308; }
        body.theme-green { --bg-body: #F0FDF4; --border-player: #DCFCE7; --text-main: #166534; --btn-bg: #22C55E; }
        body.theme-blue { --bg-body: #EFF6FF; --border-player: #DBEAFE; --text-main: #1E40AF; --btn-bg: #3B82F6; }
        body.theme-purple { --bg-body: #FAF5FF; --border-player: #F3E8FF; --text-main: #6B21A8; --btn-bg: #A855F7; }
        body.theme-pink { --bg-body: #FDF2F8; --border-player: #FCE7F3; --text-main: #9D174D; --btn-bg: #EC4899; }
        body.theme-white { --bg-body: #F4F4F5; --border-player: rgba(0,0,0,0.08); --text-main: #000000; --btn-bg: #000000; }

        /* AUTOMATIC BLACKOUT RULES: Background pages drops dark in system Dark Mode */
        @media (prefers-color-scheme: dark) {
            body, body[class*="theme-"] { --bg-body: #050505 !important; }
            .player-main { background-color: #0b0b0d !important; border-color: #16161a !important; box-shadow: 0 20px 45px rgba(0,0,0,0.5) !important; }
            h2, .theme-opt { color: #FFFFFF !important; }
            .btn { background-color: #FFFFFF !important; color: #050505 !important; }
        }

        body { background-color: var(--bg-body); color: var(--text-main); font-family: system-ui, -apple-system, sans-serif; margin: 0; min-height: 100vh; box-sizing: border-box; display: flex; justify-content: center; align-items: center; padding: 30px 20px; transition: background-color 0.3s ease, color 0.3s ease; }
        .app-container { display: flex; flex-direction: column; width: 100%; max-width: 340px; gap: 25px; align-items: center; }
        .player-main { position: relative; display: flex; flex-direction: column; align-items: center; width: 100%; background-color: var(--bg-player); border: 1px solid var(--border-player); border-radius: 24px; padding: 30px 24px; box-sizing: border-box; box-shadow: 0 15px 35px rgba(0,0,0,0.1); transition: background-color 0.3s ease, border-color 0.3s ease; }
        .settings-trigger { position: absolute; top: 22px; right: 22px; font-size: 20px; cursor: pointer; opacity: 0.7; -webkit-tap-highlight-color: transparent; z-index: 60; display: block !important; line-height: 1; }
        .settings-trigger:active { transform: scale(0.9); }
        
        h2 { font-weight: 700; font-size: 24px; letter-spacing: -0.5px; margin: 0 0 20px 0; }

        /* FIXED DROPDOWN PANEL DECK: Wide 4x2 geometry rectangle list drawer frame */
        .theme-panel { 
            position: absolute; top: 55px; right: 22px; background: var(--bg-player); 
            border: 1px solid var(--border-player); border-radius: 16px; padding: 12px; 
            display: none; grid-template-columns: repeat(4, 1fr); gap: 10px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.18); z-index: 50; width: 210px; box-sizing: border-box;
        }
        .theme-opt { display: flex; align-items: center; justify-content: center; font-size: 22px; width: 38px; height: 38px; border-radius: 10px; cursor: pointer; -webkit-tap-highlight-color: transparent; }
        .theme-opt:active { transform: scale(0.9); }
        .theme-opt.reset-opt { grid-column: span 4; width: 100%; height: 32px; font-size: 12px; font-weight: 700; color: var(--text-muted); border: 1px dashed var(--border-player); margin-top: 4px; border-radius: 8px; }

        /* Creative drawing board sandbox grid grid matrix container layout */
        .canvas-board {
            width: 290px; height: 290px; display: grid;
            grid-template-columns: repeat(16, 1fr); grid-template-rows: repeat(16, 1fr);
            background: #ffffff; border: 2px solid var(--border-player);
            border-radius: 12px; overflow: hidden; box-shadow: inset 0 2px 8px rgba(0,0,0,0.05), 0 10px 25px rgba(0,0,0,0.05);
            margin-bottom: 25px; touch-action: none;
        }
        
        .pixel-node { border-right: 1px solid var(--grid-line); border-bottom: 1px solid var(--grid-line); background-color: #ffffff; }

        /* FIXED: Master color mapping lookup table rules override inline variable blocks [INDEX] */
        .pixel-node.c-red { background-color: #ef4444 !important; }
        .pixel-node.c-orange { background-color: #f97316 !important; }
        .pixel-node.c-yellow { background-color: #eab308 !important; }
        .pixel-node.c-green { background-color: #22c55e !important; }
        .pixel-node.c-blue { background-color: #3b82f6 !important; }
        .pixel-node.c-purple { background-color: #a855f7 !important; }
        .pixel-node.c-pink { background-color: #ec4899 !important; }
        
        /* FIXED: High contrast black/white ink rules link directly to your system background modes [INDEX] */
        .pixel-node.c-white { background-color: #000000 !important; }
        @media (prefers-color-scheme: dark) {
            .pixel-node.c-white { background-color: #ffffff !important; }
        }

        .btn { background-color: var(--btn-bg); padding: 14px 20px; border-radius: 30px; border: none; color: var(--btn-text); font-weight: 700; font-size: 15px; cursor: pointer; display: inline-block; width: 100%; box-sizing: border-box; text-align: center; -webkit-tap-highlight-color: transparent; transition: background-color 0.3s ease, color 0.3s ease; }
        .btn:active { opacity: 0.85; }
    </style>
</head>
<body>

    <div class="app-container">
        <div class="player-main">
            <div class="settings-trigger" id="gearBtn" onclick="toggleThemeDropdownPanel()">⚙️</div>
            
            <div class="theme-panel" id="themeDropdownMenu">
                <div class="theme-opt" onclick="swapPlayerThemeProfile('RED')">🔴</div>
                <div class="theme-opt" onclick="swapPlayerThemeProfile('ORANGE')">🟠</div>
                <div class="theme-opt" onclick="swapPlayerThemeProfile('YELLOW')">🟡</div>
                <div class="theme-opt" onclick="swapPlayerThemeProfile('GREEN')">🟢</div>
                <div class="theme-opt" onclick="swapPlayerThemeProfile('BLUE')">🔵</div>
                <div class="theme-opt" onclick="swapPlayerThemeProfile('PURPLE')">🟣</div>
                <div class="theme-opt" onclick="swapPlayerThemeProfile('PINK')">🩷</div>
                <div class="theme-opt" onclick="swapPlayerThemeProfile('WHITE')">⚪️</div>
                <div class="theme-opt reset-opt" onclick="swapPlayerThemeProfile('AUTO')">🔄 Reset Brush to Auto</div>
            </div>

            <h2>Pixel Sandbox</h2>
            <div class="canvas-board" id="pixelCanvasContainer"></div>
            <button class="btn" onclick="clearCanvasBoardSandbox()">Clear Sketch Pad</button>
        </div>
    </div>
    <script>
        const themeMenu = document.getElementById('themeDropdownMenu');
        const canvasContainer = document.getElementById('pixelCanvasContainer');
        let activeBrushColorClass = 'c-blue'; // Baseline default paint ink configuration [INDEX]
        let isUserDrawingPointerDown = false;

        function toggleThemeDropdownPanel() {
            themeMenu.style.display = themeMenu.style.display === 'grid' ? 'none' : 'grid';
        }

        function swapPlayerThemeProfile(mode) {
            themeMenu.style.display = 'none';
            document.body.className = ""; 
            
            if (mode !== 'AUTO') {
                document.body.classList.add(`theme-${mode.toLowerCase()}`);
                activeBrushColorClass = `c-${mode.toLowerCase()}`; // Set painting register [INDEX]
            } else {
                // Return default auto color based on dark setting check loops
                const isDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
                activeBrushColorClass = isDark ? 'c-blue' : 'c-blue';
            }
        }

        function compileSketchPadGrid() {
            canvasContainer.innerHTML = "";
            for (let i = 0; i < 256; i++) {
                const node = document.createElement('div');
                node.className = "pixel-node";
                
                node.addEventListener('mousedown', (e) => { isUserDrawingPointerDown = true; paintSingleGridPixelNode(node); });
                node.addEventListener('mouseenter', () => { if (isUserDrawingPointerDown) paintSingleGridPixelNode(node); });
                
                canvasContainer.appendChild(node);
            }
        }

        // FIXED GESTURE DRAG CONTROL: Maps point traces directly onto node class registers perfectly [INDEX]
        canvasContainer.addEventListener('touchstart', (e) => { isUserDrawingPointerDown = true; processDragPaintingMovement(e); }, { passive: false });
        canvasContainer.addEventListener('touchmove', (e) => { processDragPaintingMovement(e); }, { passive: false });
        window.addEventListener('mouseup', () => { isUserDrawingPointerDown = false; });
        window.addEventListener('touchend', () => { isUserDrawingPointerDown = false; });

        function processDragPaintingMovement(e) {
            e.preventDefault();
            if (!isUserDrawingPointerDown) return;
            const touch = e.touches;
            const targetNodeElement = document.elementFromPoint(touch.clientX, touch.clientY);
            
            if (targetNodeElement && targetNodeElement.classList.contains('pixel-node')) {
                paintSingleGridPixelNode(targetNodeElement);
            }
        }

        // FIXED PAINT ENGINE: Completely swaps item node classes instead of injection variables to override filters [INDEX]
        function paintSingleGridPixelNode(targetNode) {
            // Remove old colors
            targetNode.className = "pixel-node";
            // Inject selected color profile class
            targetNode.classList.add(activeBrushColorClass);
        }

        function clearCanvasBoardSandbox() {
            const allNodes = document.querySelectorAll('.pixel-node');
            allNodes.forEach(node => { node.className = "pixel-node"; });
        }

        window.addEventListener('DOMContentLoaded', compileSketchPadGrid);
        if ('serviceWorker' in navigator) { navigator.serviceWorker.register('sw.js'); }
    </script>
</body>
</html>
